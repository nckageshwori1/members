<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>नेपाली कांग्रेस — पार्टीको विधान</title>

    <style>
        /* ============================================================
           01. ROOT THEME AND GLOBAL STYLES
           ============================================================ */
        :root {
            font-family: system-ui, "Noto Sans Devanagari", sans-serif;
            color: #183453;
            background: #f3f6fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        /* ============================================================
           02. PAGE HEADER AND MAIN LAYOUT
           ============================================================ */
        header {
            background: linear-gradient(115deg, #123c70, #245d95);
            color: white;
            padding: 25px 16px;
        }

        header > div,
        main {
            max-width: 1050px;
            margin: auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(23px, 4vw, 31px);
        }

        main {
            padding: 20px 14px;
        }

        /* ============================================================
           03. NAVIGATION AND BUTTONS
           ============================================================ */
        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn {
            background: #19569c;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            text-decoration: none;
            font: 600 15px system-ui;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        /* ============================================================
           04. SEARCH PANEL AND FORM
           ============================================================ */
        .panel {
            background: white;
            border: 1px solid #dae5f0;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 16px #153e6610;
        }

        select { width:100%;padding:13px;border:1px solid #c5d2df;border-radius:10px;background:#fff;font:inherit;margin-top:9px; }

        form {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #c5d2df;
            border-radius: 10px;
            font: inherit;
        }

        /* ============================================================
           05. SEARCH RESULTS AND MESSAGES
           ============================================================ */
        .muted {
            color: #63778c;
            font-size: 13px;
            line-height: 1.65;
        }

        .answer {
            margin-top: 12px;
            border: 1px solid #dce6f0;
            border-radius: 12px;
            padding: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .source {
            font-weight: 700;
            color: #12538c;
            margin-bottom: 6px;
        }

        .notice {
            background: #fff7e8;
            border-left: 4px solid #d28a15;
            padding: 12px;
            border-radius: 8px;
            margin-top: 14px;
            line-height: 1.6;
        }

        .result-link {
            font-size: 13px;
            color: #17549a;
        }

        .summary {
            margin-top: 14px;
        }

        .empty {
            color: #6b788a;
            margin-top: 14px;
        }

        /* ============================================================
           06. MOBILE RESPONSIVE STYLES
           ============================================================ */
        @media (max-width: 600px) {
            .panel {
                padding: 15px;
            }

            form {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================================
         07. HEADER
         ============================================================ -->
    <header>
        <div>
            <h1>📖 नेपाली कांग्रेस — पार्टीको विधान</h1>
            <div>Google Sheet मा सुरक्षित विधानका धारा तथा पूर्ण व्याख्या</div>
        </div>
    </header>

    <!-- ============================================================
         08. MAIN CONTENT
         ============================================================ -->
    <main>
        <nav>
            <a class="btn" href="index.html">← गृहपृष्ठ</a>
            <a
                class="btn"
                id="pdfLink"
                href="NC_bidhan_2082.pdf"
                target="_blank"
                rel="noopener"
            >📄 PDF मा पढ्नुहोस् ↗</a>
        </nav>

        <section class="panel">
            <h2>🔎 विधान खोज तथा सहायता</h2>
            <label for="topicSelect">धारा / विषय छान्नुहोस्</label>
            <select id="topicSelect" aria-label="विधानको धारा छान्नुहोस्"><option value="">— धारा / विषय छान्नुहोस् —</option></select>

            <form id="searchForm">
                <input
                    id="question"
                    maxlength="300"
                    minlength="2"
                    required
                    placeholder="उदाहरण: क्रियाशील सदस्यता"
                    aria-label="विधानको पाठ खोज्नुहोस्"
                >
                <button id="submit" class="btn" type="submit">खोज्नुहोस्</button>
            </form>

            <div id="status" class="muted summary" aria-live="polite">
                Bidhan_Data Sheet बाट विवरण लोड हुँदैछ...
            </div>

            <div id="results" aria-live="polite"></div>
        </section>
    </main>

    <script>
        'use strict';

        // ============================================================
        // 01. CONFIGURATION
        // ============================================================
        const API_URL =
            'https://script.google.com/macros/s/AKfycbzq4EDX6gfB20LN0F071kj2ysbCUX-PETlIlzF7y0dbwIW7WBO23m7vy6xTlB189g4wuQ/exec';

        const $ = id => document.getElementById(id);

        // ============================================================
        // 02. API REQUEST
        // ============================================================
        async function request(action, data = {}) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, ...data })
            });

            if (!response.ok) {
                throw new Error('सर्भरसँग सम्पर्क हुन सकेन ।');
            }

            const result = await response.json();

            if (!result.ok) {
                throw new Error(result.message || 'विधान विवरण उपलब्ध छैन ।');
            }

            return result;
        }

        // ============================================================
        // 03. SAFE ELEMENT HELPER
        // ============================================================
        function makeElement(tag, className, value) {
            const element = document.createElement(tag);
            element.className = className || '';
            element.textContent = value || '';
            return element;
        }

        // ============================================================
        // 04. LOAD ALL TOPICS FROM BIDHAN_DATA
        // ============================================================
        async function loadTopics() {
            try {
                const result = await request('bidhanList');
                const dropdown = $('topicSelect');

                for (const topic of result.topics || []) {
                    const option = document.createElement('option');
                    option.value = String(topic.row);
                    option.textContent = topic.title;
                    dropdown.append(option);
                }

                $('status').textContent =
                    result.count + ' वटा धारा / विषय उपलब्ध छन् ।';
            } catch (error) {
                $('status').textContent = error.message;
            }
        }

        // ============================================================
        // 05. SHOW FULL SHEET TEXT, NEVER SHORTEN
        // ============================================================
        function showResults(records) {
            const container = $('results');
            container.replaceChildren();

            if (!records.length) {
                container.append(makeElement(
                    'div', 'notice', 'सम्बन्धित विधानको विवरण भेटिएन ।'
                ));
                return;
            }

            for (const record of records) {
                const article = makeElement('article', 'answer');

                article.append(makeElement(
                    'div', 'source', record.title
                ));

                article.append(makeElement(
                    'div', '', record.text
                ));

                container.append(article);
            }
        }

        // ============================================================
        // 06. SEARCH OR SELECT EXACT TOPIC
        // ============================================================
        async function searchBidhan(event) {
            if (event) event.preventDefault();

            const button = $('submit');
            const query = $('question').value.trim();
            const selectedRow = $('topicSelect').value;

            button.disabled = true;
            $('status').textContent = 'विधान विवरण खोजिँदैछ...';

            try {
                const result = await request('bidhanSearch', {
                    query: query
                });

                let rows = result.rows || [];

                if (selectedRow && !query) {
                    rows = rows.filter(row =>
                        String(row.row) === selectedRow
                    );
                }

                showResults(rows);
                $('status').textContent =
                    rows.length + ' वटा सम्बन्धित विषय भेटिए ।';
            } catch (error) {
                $('status').textContent = error.message;
                $('results').replaceChildren();
            } finally {
                button.disabled = false;
            }
        }

        // ============================================================
        // 07. DROPDOWN SELECTION
        // ============================================================
        $('topicSelect').addEventListener('change', async function () {
            $('question').value = '';

            if (this.value) {
                await searchBidhan();
            } else {
                $('results').replaceChildren();
            }
        });

        $('searchForm').addEventListener('submit', function (event) {
            $('topicSelect').value = '';
            searchBidhan(event);
        });

        // ============================================================
        // 08. INITIALIZATION
        // ============================================================
        loadTopics();
    </script>
</body>
</html>
