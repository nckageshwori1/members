name: Generate event social previews
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate social metadata pages
        run: python tools/generate_event_previews.py
      - name: Commit generated event pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/
          if ! git diff --cached --quiet; then
            git commit -m "Update event social previews"
            git push
          fi
