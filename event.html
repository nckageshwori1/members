<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d315d"><title>कार्यक्रम विवरण | नेपाली कांग्रेस वडा नं. १</title>
<meta name="description" content="नेपाली कांग्रेस कागेश्वरी मनोहरा वडा नं. १ — कार्यक्रमको मिति, समय, स्थान, सूचना र फोटो।">
<style>
/* Keep completed-event controls hidden even when .actions/.btn set display. */
[hidden] { display: none !important; }

:root{font-family:"Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif;color:#153352;background:#f0f5fb}*{box-sizing:border-box}body{margin:0}a{color:inherit}.head{background:#fff;border-bottom:1px solid #dbe5f1}.headin{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:13px 18px}.head img{width:46px;height:46px;object-fit:contain}.head strong{display:block;color:#d21d2b;font-size:18px}.head small{color:#63758a}.back{margin-left:auto;text-decoration:none;border:1px solid #d9e4f0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px}main{max-width:1080px;margin:28px auto;padding:0 15px 36px}.panel{background:#fff;border:1px solid #dbe5f1;border-radius:22px;padding:22px;box-shadow:0 10px 35px #102f5010}.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;align-items:start}.poster{width:100%;max-height:540px;object-fit:contain;background:#f4f8fb;border:1px solid #e1e8f0;border-radius:17px}.eyebrow{display:inline-block;border-radius:50px;background:#eaf6ed;color:#087342;padding:8px 14px;font-weight:900;font-size:12px}.eyebrow.upcoming{background:#fff0df;color:#a85c00}.eyebrow.live{background:#ffe9ec;color:#b21d30}.eyebrow.done{background:#e6f7ed;color:#087342}h1{font-size:clamp(24px,3.4vw,36px);line-height:1.5;margin:14px 0;color:#0d315d}.info{display:grid;gap:12px}.line{font-size:15px;display:flex;gap:9px;align-items:start;line-height:1.7}.line b{white-space:nowrap}.description{border-top:1px solid #e2eaf4;margin-top:17px;padding-top:15px;line-height:1.9;white-space:pre-wrap}.timer{background:linear-gradient(115deg,#fff4e7,#ffe9d6);border:1px solid #ffdcc0;border-radius:17px;margin-top:18px;padding:15px;color:#a14c00}.timer>strong{display:block;margin-bottom:10px}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.unit{border-radius:11px;background:#fff;border:1px solid #f8d5c6;text-align:center;padding:10px 3px}.unit b{display:block;font-size:24px;color:#cf2636}.unit small{color:#a75b41;font-weight:700}.state{border-radius:13px;padding:13px 15px;background:#e7f8ee;color:#087442;font-weight:900;margin-top:16px}.state.live{background:#ffedf0;color:#b1122a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:12px 16px;font:800 14px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;background:#eff5fb;color:#0d315d}.btn.main{background:#0d315d;color:#fff}.btn.share{background:#078b49;color:#fff}.btn:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;color:#60758a;line-height:1.7;margin-top:13px}.loading{text-align:center;padding:55px 15px;color:#536a83}.error{background:#fff1f1;border:1px solid #ffc9c9;border-radius:12px;padding:17px;color:#a51e2a}.footer{text-align:center;color:#63758a;font-size:12px;padding:20px 12px;line-height:1.9;border-top:1px solid #dbe5f1;background:#fff}.footer strong{color:#0d315d}.actions[hidden],.hint[hidden]{display:none!important}.btn.map{background:#eaf5ff;color:#0758a7}.btn.calendar{background:#fff2e5;color:#934d08}.error button{margin-top:12px}@media(max-width:720px){main{margin:12px auto}.panel{padding:14px;border-radius:16px}.hero{grid-template-columns:1fr;gap:15px}.poster{max-height:350px}.head strong{font-size:14px}.head small{font-size:10px}.back{font-size:11px;padding:8px}.units .unit b{font-size:20px}.actions .btn{flex:1 1 125px;padding:11px 9px}}
</style></head><body>
<header class="head"><div class="headin"><img src="tree-logo.png" alt="नेपाली कांग्रेस"><div><strong>नेपाली कांग्रेस — वडा नं. १</strong><small>कार्यक्रम तथा सूचना विवरण</small></div><a class="back" href="index.html">← गृहपृष्ठ</a></div></header>
<main><div class="panel" id="content"><div class="loading">कार्यक्रमको विवरण लोड हुँदैछ...</div></div></main><footer class="footer">नेपाली कांग्रेस • कागेश्वरी मनोहरा नगरपालिका वडा नं. १ • डिजिटल अभिलेख प्रणाली<br><strong>Designed &amp; Developed by Nirajan Aryal (9851113811)</strong></footer>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzq4EDX6gfB20LN0F071kj2ysbCUX-PETlIlzF7y0dbwIW7WBO23m7vy6xTlB189g4wuQ/exec';
const eventId=new URLSearchParams(location.search).get('id');
const SHARE_BASE=new URL('./events/',location.href);
function shareUrl(id){return new URL(encodeURIComponent(id)+'/',SHARE_BASE).href;}
function safeMapUrl(s){try{const u=new URL(String(s||''));return u.protocol==='https:' && (/^(www\.)?google\.[a-z.]+$/.test(u.hostname)||u.hostname==='maps.app.goo.gl'||u.hostname==='goo.gl')?u.href:'';}catch(e){return '';}}
let eventTimer=null;
let currentEvent=null;
const el=document.getElementById('content');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nep=v=>String(v).replace(/[0-9]/g,d=>'०१२३४५६७८९'[Number(d)]);
const ascii=v=>String(v||'').replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
function parseDate(s){const a=ascii(s).trim().replace(/-/g,'/').split('/').map(Number);if(a.length!==3||a.some(x=>!Number.isFinite(x)))return null;const [y,m,d]=a;if(y!==2083||m<1||m>12||d<1||d>32)return null;const starts=['2026-04-14','2026-05-15','2026-06-15','2026-07-17','2026-08-17','2026-09-17','2026-10-18','2026-11-17','2026-12-16','2027-01-15','2027-02-13','2027-03-15'];return Date.parse(starts[m-1]+'T00:00:00Z')+(d-1)*86400000;}
function clock(s){let t=ascii(s).trim(),m=t.match(/(\d{1,2})\s*[:.]\s*(\d{1,2})/);if(!m)return null;let h=+m[1],min=+m[2];if(/बेलुका|साँझ|रात|pm/i.test(t)&&h<12)h+=12;if(/बिहान|am/i.test(t)&&h===12)h=0;return h<24&&min<60?h*60+min:null;}
function nepNow(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kathmandu',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);}
function state(n){const date=parseDate(n['मिति']);if(date===null)return{kind:'none',label:'कार्यक्रम सूचना'};const start=clock(n['सुरु समय']),end=clock(n['समाप्ति समय']),allDay=String(n['दिनभरि']).toLowerCase()==='true';const from=date+(start??0)*60000;const to=date+(end===null?1440:end+(start!==null&&end<=start?1440:0))*60000;const now=nepNow();if(now>=to)return{kind:'done',label:'✓ कार्यक्रम सम्पन्न'};if(now>=from)return{kind:'live',label:'● कार्यक्रम सञ्चालनमा'};return{kind:'upcoming',label:'▣ आगामी कार्यक्रम',seconds:Math.max(0,Math.ceil((from-now)/1000))};}
function timer(n){const s=state(n);const calendarBtn=document.getElementById('calendarBtn');if (calendarBtn) {
  // A finished event must never offer an Add to Calendar action.
  calendarBtn.hidden = !['upcoming', 'live'].includes(s.kind);
  calendarBtn.style.display = ['upcoming', 'live'].includes(s.kind) ? '' : 'none';
}const shareActions=document.getElementById('shareActions'),shareHint=document.getElementById('shareHint');if(shareActions)shareActions.hidden=(s.kind==='done');if(shareHint)shareHint.hidden=(s.kind==='done');const tag=document.getElementById('stateBadge'),box=document.getElementById('timerBox');if(!tag||!box)return;tag.className='eyebrow '+s.kind;tag.textContent=s.label;if(s.kind==='upcoming'){let x=s.seconds;const vals=[Math.floor(x/86400),Math.floor(x%86400/3600),Math.floor(x%3600/60),x%60];box.className='timer';box.innerHTML='<strong>⏳ कार्यक्रम सुरु हुन बाँकी समय</strong><div class="units">'+vals.map((v,i)=>'<div class="unit"><b>'+nep(v)+'</b><small>'+['दिन','घण्टा','मिनेट','सेकेन्ड'][i]+'</small></div>').join('')+'</div>';}
else if(s.kind==='live'){box.className='state live';box.textContent='● कार्यक्रम अहिले सञ्चालनमा छ';}else if(s.kind==='done'){box.className='state';box.textContent='✓ कार्यक्रम निर्धारित समयअनुसार सम्पन्न भएको छ';}else{box.className='hint';box.textContent='कार्यक्रमको मिति हेर्नुहोस् ।';}}
function message(n){return [n['शीर्षक']||'कार्यक्रम सूचना',n['मिति']?'📅 मिति: '+n['मिति']:'',n['समय']?'🕒 समय: '+n['समय']:'',n['स्थान']?'📍 स्थान: '+n['स्थान']:'',n['विवरण']||'','🔗 पूरा विवरण र फोटो: '+shareUrl(String(n.ID||eventId))].filter(Boolean).join('\n');}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){prompt('यो विवरण कपी गर्नुहोस्:',t);return false}}
async function share() {
  const event = currentEvent;
  if (!event || state(event).kind === 'done') return;

  const button = document.getElementById('shareBtn');
  const originalLabel = button.textContent;
  const url = shareUrl(String(event.ID || eventId));
  button.disabled = true;
  button.textContent = 'शेयर तयार हुँदैछ...';

  try {
    // Share only the canonical URL so WhatsApp can render its poster preview.
    // Do not also include the URL in text or attach a photo file.
    if (navigator.share) {
      try {
        await navigator.share({ url });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }

    if (await copyText(url)) {
      alert('फोटो Preview सहितको कार्यक्रम लिंक कपी भयो। WhatsApp मा Paste गर्नुहोस्।');
    }
  } finally {
    button.disabled = false;
    button.textContent = originalLabel;
  }
}
function addCalendar(n){
 if(!['upcoming', 'live'].includes(state(n).kind)){return;}
 const day=parseDate(n['मिति']);if(day===null){alert('नेपाली मिति प्रमाणित रूपमा रूपान्तरण हुन सकेन।');return;}
 const start=clock(n['सुरु समय']),end=clock(n['समाप्ति समय']);
 const allDay=String(n['दिनभरि']).toLowerCase()==='true';
 if(!allDay&&(start===null||end===null)){alert('क्यालेन्डरका लागि सुरु र समाप्ति समय आवश्यक छ।');return;}
 const stamp=ms=>{const d=new Date(ms);return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');};
 // Existing parseDate yields midnight UTC representing the Nepal civil date. Subtract +05:45 to get actual UTC instant.
 const offset=345*60000;const from=day+(allDay?0:start)*60000-offset;
 const to=day+(allDay?1440:end+(end<=start?1440:0))*60000-offset;
 const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(n['शीर्षक']||'कार्यक्रम')+'&dates='+stamp(from)+'%2F'+stamp(to)+'&details='+encodeURIComponent((n['विवरण']||'')+'\n'+location.href)+'&location='+encodeURIComponent(n['स्थान']||'');
 window.open(url,'_blank','noopener,noreferrer');
}
function render(n){currentEvent=n;document.title=(n['शीर्षक']||'कार्यक्रम विवरण')+' | नेपाली कांग्रेस वडा नं. १';const mapUrl=safeMapUrl(n['MapURL']||n['Map URL']||n['नक्सा लिंक']);const pic=n.ImageURL?'<img class="poster" id="poster" src="'+esc(n.ImageURL)+'" alt="कार्यक्रमको मूल पोस्टर">':'<div class="poster loading">यस कार्यक्रममा फोटो छैन।</div>';
 el.innerHTML='<div class="hero"><div>'+pic+'</div><div><span id="stateBadge" class="eyebrow">कार्यक्रम सूचना</span><h1>'+esc(n['शीर्षक']||'सूचना')+'</h1><div class="info">'+(n['मिति']?'<div class="line"><b>📅 मिति:</b><span>'+esc(n['मिति'])+'</span></div>':'')+(n['समय']?'<div class="line"><b>🕒 समय:</b><span>'+esc(n['समय'])+'</span></div>':'')+(n['स्थान']?'<div class="line"><b>📍 स्थान:</b><span>'+esc(n['स्थान'])+'</span></div>':'')+'</div>'+(n['विवरण']?'<div class="description">'+esc(n['विवरण'])+'</div>':'')+'<div id="timerBox"></div><div class="actions" id="shareActions"><button id="shareBtn" class="btn share" type="button">↗ फोटो Preview सहित शेयर</button><button id="copyBtn" class="btn main" type="button">🔗 लिंक कपी</button><button id="copyMessageBtn" class="btn" type="button">📋 पूरा मेसेज कपी</button></div><p class="hint" id="shareHint">शेयर गर्दा फोटो Preview देखाउन कार्यक्रमको एउटै स्थायी लिंक पठाइन्छ। पूरा विवरण टेक्स्टमा चाहिँ «पूरा मेसेज कपी» प्रयोग गर्नुहोस्।</p><div class="actions" id="extraActions"><button id="calendarBtn" class="btn calendar" type="button">📅 क्यालेन्डरमा राख्नुहोस्</button>'+(mapUrl?'<a class="btn map" href="'+esc(mapUrl)+'" target="_blank" rel="noopener noreferrer">📍 Google Maps मा हेर्नुहोस्</a>':'')+'</div></div></div>';
 document.getElementById('shareBtn').addEventListener('click',share);document.getElementById('calendarBtn').addEventListener('click',()=>addCalendar(n));document.getElementById('copyBtn').addEventListener('click',async()=>{if(state(n).kind==='done')return;if(await copyText(shareUrl(String(n.ID||eventId))))alert('कार्यक्रमको स्थायी लिंक कपी भयो।')});document.getElementById('copyMessageBtn').addEventListener('click',async()=>{if(state(n).kind==='done')return;if(await copyText(message(n)))alert('कार्यक्रमको पूरा मेसेज कपी भयो।')});timer(n);if(eventTimer)clearInterval(eventTimer);eventTimer=setInterval(()=>timer(n),1000);}
async function load(){if(!eventId){el.innerHTML='<div class="error">कार्यक्रमको लिंकमा ID छैन। कृपया गृहपृष्ठबाट कार्यक्रम छान्नुहोस्।</div>';return}try{const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publicHome'})});if(!resp.ok)throw Error('Server '+resp.status);const data=await resp.json();if(!data.ok)throw Error(data.message||'API error');const n=(data.notices||[]).find(x=>String(x.ID||'').trim()===eventId);if(!n){el.innerHTML='<div class="error">यो सूचना उपलब्ध छैन वा प्रकाशनबाट हटाइएको छ।</div>';return}render(n);}catch(e){el.innerHTML='<div class="error">कार्यक्रमको विवरण लोड हुन सकेन। इन्टरनेट जाँचेर फेरि प्रयास गर्नुहोस्।<div style="margin-top:12px"><button class="btn main" onclick="location.reload()">↻ पुनः प्रयास</button></div></div>';}}
load();
</script></body></html>
